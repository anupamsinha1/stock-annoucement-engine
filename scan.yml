name: Market Intelligence Scan

on:
  # Automated Scheduled Cron: Every 15 minutes, Monday through Friday (3:30 AM to 10:30 AM UTC = 9:00 AM to 4:00 PM IST)
  schedule:
    - cron: '*/15 3-10 * * 1-5'

  # Manual Trigger (Usable from GitHub Web & GitHub Mobile App)
  workflow_dispatch:
    inputs:
      ignore_cache:
        description: 'Force fresh scan (ignore DB cache)'
        required: false
        default: false
        type: boolean

jobs:
  run-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Scan Engine
        env:
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          GEMINI_API_KEY_PAID: ${{ secrets.GEMINI_API_KEY_PAID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          IGNORE_CACHE: ${{ github.event.inputs.ignore_cache || 'false' }}
        run: |
          python engine.py