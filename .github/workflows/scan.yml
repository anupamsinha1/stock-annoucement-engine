name: Market Intelligence Scan (GitHub Engine)

on:
  # CRON SCHEDULE (All times converted from IST to UTC)
  # IST = UTC + 5:30 | Runs Monday through Friday (1-5)
  schedule:
    # 1. 06:00 AM to 08:00 AM IST -> 00:30 and 01:30 UTC (Every hour)
    - cron: '30 0-1 * * 1-5'

    # 2. 08:00 AM to 04:00 PM (16:00) IST -> 02:30 to 10:30 UTC (Every 30 mins)
    - cron: '30,0 2-10 * * 1-5'

    # 3. 04:00 PM (16:00) to 10:00 PM (22:00) IST -> 10:30 to 16:30 UTC (Every hour)
    - cron: '30 10-16 * * 1-5'

  # MANUAL TRIGGER: Allows you to run it manually via GitHub website or app
  workflow_dispatch:
    inputs:
      ignore_cache:
        description: 'Force fresh scan (ignore DB cache)'
        required: false
        default: false
        type: boolean

jobs:
  run-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Ollama & Qwen 2.5 7B Caching Layer for Sieve 40
      - name: Cache Ollama Models
        id: cache-ollama
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-qwen2.5-7b-${{ runner.os }}

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama Server in Background
        run: ollama serve &

      - name: Pull Qwen 2.5 7B Model (Instant load from cache if available)
        run: |
          sleep 3
          ollama pull qwen2.5:7b

      - name: Execute GitHub Screening Engine
        env:
          #Choose between GITHUB or LOCAL
          EXECUTION_ENVIRONMENT: "GITHUB"
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          GEMINI_API_KEY_PAID: ${{ secrets.GEMINI_API_KEY_PAID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ALERT_ON_SINGLE_MODEL_IGNORE: ${{ vars.ALERT_ON_SINGLE_MODEL_IGNORE || 'false' }}
          IGNORE_CACHE: ${{ github.event.inputs.ignore_cache || 'false' }}
          USE_LOCAL_EXTRACTOR: 'true'
          OLLAMA_API_URL: 'https://api.groq.com/openai/v1/chat/completions',
          OLLAMA_MODEL: 'qwen/qwen3.8-27b'
        run: |
          python engine_github.py