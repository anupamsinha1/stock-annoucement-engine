name: Market Intelligence Scan

on:
  # SCHEDULE 1: Every 15 minutes during the day (6:30 AM to 5:15 PM IST)
  # GitHub uses UTC. IST is UTC + 5:30.
  # 1:00 UTC to 11:45 UTC covers this window Mon-Fri.
  schedule:
    - cron: '*/15 1-11 * * 1-5'

    # SCHEDULE 2: Every 1 hour in the evening (6:00 PM to 11:00 PM IST)
    # Runs at the bottom of the hour in UTC (e.g., 12:30 UTC = 6:00 PM IST)
    # Covers 12:30 UTC to 17:30 UTC Mon-Fri.
    - cron: '30 12-17 * * 1-5'

  # MANUAL TRIGGER: Allows you to run it via the GitHub website or Mobile App
  workflow_dispatch:
    inputs:
      ignore_cache:
        description: 'Force fresh scan (ignore DB cache)'
        required: false
        default: false
        type: boolean

jobs:
  run-screen:
    runs-on: ubuntu-latest
    steps:
      # 1. Pull your code from the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python environment
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install dependencies from requirements.txt
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Run the Engine with Secure Environment Variables
      - name: Execute Scan Engine
        env:
          # Securely injects keys from GitHub Secrets
          GEMINI_API_KEY_FREE: ${{ secrets.GEMINI_API_KEY_FREE }}
          GEMINI_API_KEY_PAID: ${{ secrets.GEMINI_API_KEY_PAID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}

          # Injects configuration settings (Defaults to true/false if missing)
          ALERT_ON_SINGLE_MODEL_IGNORE: ${{ vars.ALERT_ON_SINGLE_MODEL_IGNORE || 'true' }}
          IGNORE_CACHE: ${{ github.event.inputs.ignore_cache || 'false' }}
        run: |
          python engine.py